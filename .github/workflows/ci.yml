name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint

      # vite build 는 esbuild 로 타입을 벗겨내기만 하고 검사하지 않는다.
      # 이 단계가 없어서 import 가 빠진 컴포넌트가 그대로 배포된 적이 있다.
      - run: npm run typecheck

      - run: npm run test
      - run: npm run build
